name: 全息 arXiv 每日推送

on:
  schedule:
    # GitHub Actions 使用 UTC：工作日北京时间 14:45–19:45。
    # 使用本仓库已实际运行过的纯 UTC 写法，避免时区字段导致调度注册异常。
    - cron: '45 6-11 * * 1-5'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "只部署当前网站，不抓取论文、不调用 DeepSeek、不发送 PushPlus"
        required: false
        default: false
        type: boolean

concurrency:
  group: holo-arxiv-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL || 'deepseek-v4-pro' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
      PUSHPLUS_ENABLED: ${{ vars.PUSHPLUS_ENABLED || 'false' }}
      PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC }}
      PUSHPLUS_CALLBACK_URL: ${{ vars.PUSHPLUS_CALLBACK_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 记录触发来源
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule || 'manual' }}"
          date -u '+UTC 时间: %Y-%m-%d %H:%M:%S'
      - name: 运行测试
        run: python -m pytest -q
      - name: 抓取、分类、生成网页并推送
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: python -m holo_arxiv
      - name: 检查归档与网站单文件大小
        run: python -m holo_arxiv.size_guard data docs
      - name: 仅在内容变化时提交历史与网站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update daily arXiv digest"
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            if git rebase -X ours origin/main && git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $attempt 次推送失败，3 秒后重试"
            sleep 3
          done
          echo "推送最终失败" >&2
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
