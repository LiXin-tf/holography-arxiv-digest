name: 全息 arXiv 每日推送

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: holo-arxiv-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL || 'deepseek-v4-pro' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_ENABLED: ${{ vars.PUSHPLUS_ENABLED || 'false' }}
      PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC }}
      PUSHPLUS_CALLBACK_URL: ${{ vars.PUSHPLUS_CALLBACK_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行测试
        run: python -m pytest -q
      - name: 抓取、分类、生成网页并推送
        run: python -m holo_arxiv
      - name: 仅在内容变化时提交历史与网站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/state.json
          git diff --cached --quiet || (git commit -m "chore: update daily arXiv digest" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
